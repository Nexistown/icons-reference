<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icon Reference — Nexistown</title>
    <link rel="icon" type="image/png" href="nexistown-logo.png">
    <style>
        :root {
            --bg: #1c1f24;
            --fg: #e6e6e6;
            --muted: #8a93a0;
            --border: #333842;
            --accent:     #34D57F;
            --accent-dim: rgba(52,213,127,.12);
            --accent-strong: #03461B;
            --accent-light:  #7FD3B2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
        }
        .shell {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .brand img {
            height: 28px;
            width: auto;
            display: block;
        }
        .brand span {
            font-size: .88rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: -.01em;
        }
        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            flex-shrink: 0;
        }
        .page-title {
            font-size: .82rem;
            color: var(--muted);
            white-space: nowrap;
        }
        .tabs { display: flex; margin-left: auto; }
        .tab {
            padding: 6px 15px;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: color .15s, background .15s, border-color .15s;
        }
        .tab:first-child { border-radius: 6px 0 0 6px; }
        .tab:last-child  { border-radius: 0 6px 6px 0; border-left: none; }
        .tab.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="shell">
        <a class="brand" href="https://nexistown.com.br" target="_blank">
            <img src="nexistown-logo.png" alt="Nexistown">
        </a>
        <div class="divider"></div>
        <span class="page-title">Icon Reference</span>
        <div class="tabs">
            <button class="tab active" id="tab-fsphp" onclick="switchTab('fsphp')">FSPHP Native Icons</button>
            <button class="tab" id="tab-icomoon" onclick="switchTab('icomoon')">IcoMoon Free</button>
        </div>
    </div>
    <iframe id="frame" src="docs-fsphp.html"></iframe>

    <script>
        const PAGES = {
            fsphp:   'docs-fsphp.html',
            icomoon: 'docs-icomoon.html',
        }
        const ACCENTS = {
            fsphp:   ['#34D57F', 'rgba(52,213,127,.12)'],
            icomoon: ['#ffb86b', 'rgba(255,184,107,.12)'],
        }
        let current = 'fsphp'

        function switchTab(tab) {
            if (tab === current) return
            current = tab
            document.getElementById('frame').src = PAGES[tab]
            document.getElementById('tab-fsphp').classList.toggle('active', tab === 'fsphp')
            document.getElementById('tab-icomoon').classList.toggle('active', tab === 'icomoon')
            const [accent, dim] = ACCENTS[tab]
            document.documentElement.style.setProperty('--accent', accent)
            document.documentElement.style.setProperty('--accent-dim', dim)
        }
    </script>
</body>
</html>
