<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icon Reference — FSPHP + IcoMoon</title>
    <style>
        :root {
            --bg: #1c1f24;
            --fg: #e6e6e6;
            --muted: #8a93a0;
            --border: #333842;
            --accent: #61ddbc;
            --accent-dim: rgba(97,221,188,.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
        }
        .shell {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }
        .shell h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
        .tabs { display: flex; }
        .tab {
            padding: 7px 16px;
            font-size: .84rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: color .15s, background .15s, border-color .15s;
        }
        .tab:first-child { border-radius: 6px 0 0 6px; }
        .tab:last-child  { border-radius: 0 6px 6px 0; border-left: none; }
        .tab.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="shell">
        <h1>🎨 Icon Reference</h1>
        <div class="tabs">
            <button class="tab active" id="tab-fsphp" onclick="switchTab('fsphp')">FSPHP Native Icons</button>
            <button class="tab" id="tab-icomoon" onclick="switchTab('icomoon')">IcoMoon Free</button>
        </div>
    </div>
    <iframe id="frame" src="docs-fsphp.html"></iframe>

    <script>
        const PAGES = {
            fsphp:   'docs-fsphp.html',
            icomoon: 'docs-icomoon.html',
        }
        const ACCENTS = {
            fsphp:   ['#61ddbc', 'rgba(97,221,188,.12)'],
            icomoon: ['#ffb86b', 'rgba(255,184,107,.12)'],
        }
        let current = 'fsphp'

        function switchTab(tab) {
            if (tab === current) return
            current = tab
            document.getElementById('frame').src = PAGES[tab]
            document.getElementById('tab-fsphp').classList.toggle('active', tab === 'fsphp')
            document.getElementById('tab-icomoon').classList.toggle('active', tab === 'icomoon')
            const [accent, dim] = ACCENTS[tab]
            document.documentElement.style.setProperty('--accent', accent)
            document.documentElement.style.setProperty('--accent-dim', dim)
        }
    </script>
</body>
</html>
